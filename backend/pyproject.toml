[project]
name = "kotoba-studio-server"
version = "0.1.0"
description = "Kotoba Studio backend: capture, dictionary, FSRS review and export for Japanese sentence mining."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
  "fastapi>=0.141",
  "uvicorn[standard]>=0.53",
  "sqlalchemy>=2.0.40",
  "alembic>=1.20",
  "pydantic>=2.10",
  "pydantic-settings>=2.10",
  "platformdirs>=4.3",
  "fsrs>=6.3",
  "fugashi>=1.5",
  "unidic-lite>=1.0.8",
  "pillow>=11",
  "mss>=10",
  "httpx>=0.28",
  "keyring>=25",
  "segno>=1.6",
  "genanki>=0.13",
  "python-multipart>=0.0.20",
  "pyperclip>=1.11.0",
  "websockets>=14",
  "pynput>=1.8",
]

[project.optional-dependencies]
macos = ["pyobjc-framework-Vision>=11; sys_platform == 'darwin'", "pyobjc-framework-Quartz>=11; sys_platform == 'darwin'"]
windows = ["winocr; sys_platform == 'win32'"]
ocr-onnx = ["rapidocr>=3"]
optimizer = ["fsrs[optimizer]>=6.3"]
dev = ["pytest>=8", "ruff>=0.12", "pytest-freezer>=0.4"]

[project.scripts]
kotoba = "kotoba.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kotoba"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
