name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # backend/kotoba/data/ is bundled package data and is meant to be tracked;
      # only the runtime directory at the repository root is forbidden.
      - name: No runtime data or build output in the repository
        run: |
          bad=$(git ls-files | grep -E \
            '^data/|(^|/)\.venv/|(^|/)node_modules/|^frontend/(dist|dev-dist)/|\.db(-wal|-shm)?$|\.apkg$|^\.env' \
            | grep -v '^\.env\.example$' || true)
          if [ -n "$bad" ]; then
            echo "::error::these files must not be tracked:"; echo "$bad"; exit 1
          fi
      - name: Manifest versions agree
        run: |
          py=$(grep -m1 '^version' backend/pyproject.toml | cut -d'"' -f2)
          js=$(node -p "require('./frontend/package.json').version")
          [ "$py" = "$js" ] || { echo "::error::backend $py != frontend $js"; exit 1; }

      - name: Makefile targets expand
        run: |
          # `make setup` is the first thing AGENTS.md tells a contributor to run, and
          # nothing else in CI uses it. A $(shell ...) that swallows its own closing
          # paren produced a recipe that had never worked; -n catches that class.
          for target in setup check fix test dev build run migrate clean version; do
            make -n "$target" >/dev/null 2>&1 || {
              echo "::error::make $target does not expand"; make -n "$target"; exit 1; }
          done

      - name: No prompts or agent scaffolding in the repository
        run: |
          bad=$(git ls-files | grep -E \
            '(^|/)superpowers/|^private/|^\.claude/|^\.cursor/|^\.aider|^\.windsurf|^\.continue/|\.prompt(\.md)?$|[-_]prompt\.md$' \
            || true)
          if [ -n "$bad" ]; then
            echo "::error::prompt or agent-tooling files must not be tracked:"; echo "$bad"; exit 1
          fi
          runner=$(git ls-files | grep -E \
            '(^|/)opencode\.jsonc?$|(^|/)\.opencode/|(^|/)\.mcp\.json$|(^|/)\.codex/|(^|/)\.goose/|(^|/)\.gemini/' \
            || true)
          if [ -n "$runner" ]; then
            echo "::error::agent runner config is personal setup, not project state:"
            echo "$runner"; exit 1
          fi
          for f in $(git ls-files '*.md'); do
            case "$f" in AGENTS.md|CONTRIBUTING.md) continue ;; esac
            if grep -qEi 'REQUIRED SUB-SKILL|superpowers:|^You are an? |作为一名|请你扮演|你是一个|<system-reminder>' "$f"; then
              echo "::error::$f reads as instructions written to a model:"; grep -nEi \
                'REQUIRED SUB-SKILL|superpowers:|^You are an? |作为一名|请你扮演|你是一个|<system-reminder>' "$f"
              exit 1
            fi
          done

      - name: No credentials in the tree
        run: |
          hits=$(grep -rEIn --exclude-dir=.git --exclude-dir=node_modules \
            'sk-[A-Za-z0-9_-]{16,}|gh[pousr]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|BEGIN [A-Z ]*PRIVATE KEY' . \
            | grep -vE '\.githooks/|\.github/workflows/|docs/' || true)
          if [ -n "$hits" ]; then echo "::error::possible credential:"; echo "$hits"; exit 1; fi
      - name: Commit messages follow Conventional Commits
        if: github.event_name == 'pull_request'
        run: |
          git fetch --quiet origin ${{ github.base_ref }}
          bad=0
          while read -r sha; do
            subject=$(git log -1 --format=%s "$sha")
            case "$subject" in "Merge "*|"Revert "*) continue ;; esac
            echo "$subject" | grep -Eq \
              '^(feat|fix|docs|refactor|perf|test|build|ci|chore|style|revert)(\([a-z0-9_/-]+\))?!?: .{1,}' \
              || { echo "::error::bad subject: $subject"; bad=1; }
          done < <(git rev-list origin/${{ github.base_ref }}..HEAD)
          exit $bad

  backend:
    name: backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest -q

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Types
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
