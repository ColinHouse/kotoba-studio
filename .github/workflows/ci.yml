name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No runtime data or build output in the repository
        run: |
          bad=$(git ls-files | grep -E \
            '(^|/)data/|(^|/)\.venv/|(^|/)node_modules/|^frontend/(dist|dev-dist)/|\.db(-wal|-shm)?$|\.apkg$|^\.env' \
            || true)
          if [ -n "$bad" ]; then
            echo "::error::these files must not be tracked:"; echo "$bad"; exit 1
          fi
      - name: No credentials in the tree
        run: |
          hits=$(grep -rEIn --exclude-dir=.git --exclude-dir=node_modules \
            'sk-[A-Za-z0-9_-]{16,}|gh[pousr]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|BEGIN [A-Z ]*PRIVATE KEY' . \
            | grep -vE '\.githooks/|\.github/workflows/|docs/' || true)
          if [ -n "$hits" ]; then echo "::error::possible credential:"; echo "$hits"; exit 1; fi
      - name: Commit messages follow Conventional Commits
        if: github.event_name == 'pull_request'
        run: |
          git fetch --quiet origin ${{ github.base_ref }}
          bad=0
          while read -r sha; do
            subject=$(git log -1 --format=%s "$sha")
            case "$subject" in "Merge "*|"Revert "*) continue ;; esac
            echo "$subject" | grep -Eq \
              '^(feat|fix|docs|refactor|perf|test|build|ci|chore|style|revert)(\([a-z0-9_/-]+\))?!?: .{1,}' \
              || { echo "::error::bad subject: $subject"; bad=1; }
          done < <(git rev-list origin/${{ github.base_ref }}..HEAD)
          exit $bad

  backend:
    name: backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest -q

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Types
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
