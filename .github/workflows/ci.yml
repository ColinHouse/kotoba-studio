name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only ever reads the repository. The repository default happens to be `read` too,
# but stating it here means a later change to that default cannot silently widen it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The diff-based guards below compare against the base branch; a
          # shallow clone has no merge base for that, and the comparison then
          # silently returns nothing (which is how a guard passes while
          # proving nothing).
          fetch-depth: 0
      # backend/kotoba/data/ is bundled package data and is meant to be tracked;
      # only the runtime directory at the repository root is forbidden.
      - name: No runtime data or build output in the repository
        run: |
          bad=$(git ls-files | grep -E \
            '^data/|(^|/)\.venv/|(^|/)node_modules/|^frontend/(dist|dev-dist)/|\.db(-wal|-shm)?$|\.apkg$|^\.env' \
            | grep -v '^\.env\.example$' || true)
          if [ -n "$bad" ]; then
            echo "::error::these files must not be tracked:"; echo "$bad"; exit 1
          fi
      - name: Manifest versions agree
        run: |
          py=$(grep -m1 '^version' backend/pyproject.toml | cut -d'"' -f2)
          js=$(node -p "require('./frontend/package.json').version")
          [ "$py" = "$js" ] || { echo "::error::backend $py != frontend $js"; exit 1; }

      - name: Makefile targets expand
        run: |
          # `make setup` is the first thing AGENTS.md tells a contributor to run, and
          # nothing else in CI uses it. A $(shell ...) that swallows its own closing
          # paren produced a recipe that had never worked; -n catches that class.
          for target in setup check fix test dev build run migrate clean version package-windows e2e; do
            make -n "$target" >/dev/null 2>&1 || {
              echo "::error::make $target does not expand"; make -n "$target"; exit 1; }
          done

      - name: No prompts or agent scaffolding in the repository
        run: |
          bad=$(git ls-files | grep -E \
            '(^|/)superpowers/|^private/|^\.claude/|^\.cursor/|^\.aider|^\.windsurf|^\.continue/|\.prompt(\.md)?$|[-_]prompt\.md$' \
            || true)
          if [ -n "$bad" ]; then
            echo "::error::prompt or agent-tooling files must not be tracked:"; echo "$bad"; exit 1
          fi
          runner=$(git ls-files | grep -E \
            '(^|/)opencode\.jsonc?$|(^|/)\.opencode/|(^|/)\.mcp\.json$|(^|/)\.codex/|(^|/)\.goose/|(^|/)\.gemini/' \
            || true)
          if [ -n "$runner" ]; then
            echo "::error::agent runner config is personal setup, not project state:"
            echo "$runner"; exit 1
          fi
          for f in $(git ls-files '*.md'); do
            case "$f" in AGENTS.md|CONTRIBUTING.md) continue ;; esac
            if grep -qEi 'REQUIRED SUB-SKILL|superpowers:|^You are an? |作为一名|请你扮演|你是一个|<system-reminder>' "$f"; then
              echo "::error::$f reads as instructions written to a model:"; grep -nEi \
                'REQUIRED SUB-SKILL|superpowers:|^You are an? |作为一名|请你扮演|你是一个|<system-reminder>' "$f"
              exit 1
            fi
          done

      - name: No credentials in the tree
        run: |
          hits=$(grep -rEIn --exclude-dir=.git --exclude-dir=node_modules \
            'sk-[A-Za-z0-9_-]{16,}|gh[pousr]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|BEGIN [A-Z ]*PRIVATE KEY' . \
            | grep -vE '\.githooks/|\.github/workflows/|docs/' || true)
          if [ -n "$hits" ]; then echo "::error::possible credential:"; echo "$hits"; exit 1; fi
      - name: Commit messages follow Conventional Commits
        if: github.event_name == 'pull_request'
        run: |
          git fetch --quiet origin ${{ github.base_ref }}
          bad=0
          while read -r sha; do
            subject=$(git log -1 --format=%s "$sha")
            case "$subject" in "Merge "*|"Revert "*) continue ;; esac
            echo "$subject" | grep -Eq \
              '^(feat|fix|docs|refactor|perf|test|build|ci|chore|style|revert)(\([a-z0-9_/-]+\))?!?: .{1,}' \
              || { echo "::error::bad subject: $subject"; bad=1; }
          done < <(git rev-list origin/${{ github.base_ref }}..HEAD)
          exit $bad

      # The pre-commit hook guards each human's commit; this guards the merge.
      # Bypass is a label a human applies, not a magic word in a commit message:
      # labels are visible on the PR and auditable after the fact.
      - name: Protocol documents need a human
        if: github.event_name == 'pull_request'
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          git fetch --quiet origin ${{ github.base_ref }}
          files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          changed=$(printf '%s\n' "$files" | grep -E \
            '^LICENSE$|^NOTICE\.md$|^SECURITY\.md$|^docs/adr/.*\.md$|^AGENTS\.md$' || true)
          if [ -n "$changed" ]; then
            case ",$LABELS," in
              *,protected-docs-reviewed,*)
                echo "Protocol documents changed and a human added protected-docs-reviewed:"
                echo "$changed" ;;
              *)
                echo "::error::these protocol documents changed:"; echo "$changed"
                echo "A human must add the protected-docs-reviewed label, or revert them."
                exit 1 ;;
            esac
          fi

      # Users read the CHANGELOG, not the commit log. A feature that ships without
      # an entry is invisible, and 27 of them accumulated that way once. The exit
      # is a label on the PR (visible, auditable), never a magic commit keyword.
      - name: Features and fixes update the CHANGELOG
        if: github.event_name == 'pull_request'
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          git fetch --quiet origin ${{ github.base_ref }}
          subjects=$(git log --format=%s origin/${{ github.base_ref }}..HEAD)
          if ! printf '%s\n' "$subjects" | grep -Eq '^(feat|fix)(\(|:|!)'; then
            exit 0
          fi
          case ",$LABELS," in
            *,no-changelog,*)
              echo "feat/fix commits without a CHANGELOG change, excused by no-changelog"
              exit 0 ;;
          esac
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- CHANGELOG.md)
          if [ -z "$changed" ]; then
            echo "::error::this PR has feat/fix commits but does not touch CHANGELOG.md"
            echo "Update [Unreleased], or have a human add the no-changelog label."
            exit 1
          fi

  backend:
    name: backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          # The Windows extra pulls winocr, which no other runner installs. The
          # OCR test skips without the Japanese language pack, but the import,
          # availability check and provider listing still get exercised.
          - os: windows-latest
            extra: --extra windows
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev ${{ matrix.extra }}
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest -q

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Types
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend dependencies
        run: uv sync --project backend --extra dev
      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build the web app
        working-directory: frontend
        run: npm run build
      - name: Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Smoke the main path
        working-directory: frontend
        run: npm run e2e
      - name: Keep traces and screenshots when it fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: |
            frontend/test-results
            frontend/playwright-report
          retention-days: 7
