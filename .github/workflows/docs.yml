name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Deploying to Pages needs more than the repository default, so the two extra
# grants are named here and nowhere else; `contents` stays read.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one halfway: a cancelled deploy can
# leave the site serving a half-uploaded build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # lastUpdated reads git history
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
        working-directory: docs
      - run: npm run build
        working-directory: docs
      # Pages has to be switched to the Actions source once, by hand or by API, by
      # someone with admin on the repository. `enablement: true` looks like it would
      # do that and cannot: creating a Pages site needs administration:write, which
      # is not among the scopes GITHUB_TOKEN can be granted, so it fails with
      # "Resource not accessible by integration". A fork has to do the same once.
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
