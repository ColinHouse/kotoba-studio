# Dependency updates. Grouped so a week's patches arrive as one PR per ecosystem
# rather than a dozen — this is a solo project and every PR costs a review.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      backend:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: build

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      frontend:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: build
    ignore:
      # TypeScript 7 is the Go rewrite and drops the JS entry points the Vue
      # toolchain still loads. Two independent blockers, both upstream:
      #   - vue-tsc requires typescript/lib/tsc, which TS 7 no longer exports,
      #     so `npm run typecheck` and `npm run build` crash outright;
      #   - typescript-eslint refuses to run on TS 7.0 and is tracking support
      #     for >= 7.1 in typescript-eslint/typescript-eslint#10940.
      # Revisit when both ship support; until then a monthly PR would only fail
      # CI. Verified locally on 2026-09-17, not assumed from the peer ranges —
      # those already allow TS 7 and still do not work.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      docs:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: build

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
